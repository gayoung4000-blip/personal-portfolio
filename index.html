<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>김가영 — UX/UI Designer</title>
  <meta name="description" content="UX/UI 디자이너 김가영의 퍼스널 포트폴리오" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&family=Prata&family=Crimson+Text&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/style.css" />
  <noscript>
    <style>
      /* JS 없으면 인트로 없이 최종 화면 표시 */
      .mark__morph { display: none; }
      .mark__final { opacity: 1 !important; }
    </style>
  </noscript>
</head>
<body>

  <main>

    <!-- ===== 영상 로고 전환 래퍼 (VLOGO) =====
         .hvt         : 스크롤 트랙 / .hvt__sticky : viewport 고정(CSS sticky, ScrollTrigger는 pin:false)
         층: z1 히어로(흰 배경+UI) / z2 갤러리(로고 모양으로 마스킹 = "영상이 비치는 로고")
         인트로 완성 순간 is-vlogo 클래스 → 검은 SVG ↔ 영상 로고 크로스페이드(같은 실루엣).
         스크롤하면 마스크(로고 모양)가 확정 초점(0.555, 0.515) 기준으로 확대 → 갤러리 전체 화면 -->
    <div class="hvt">
      <div class="hvt__sticky">

    <!-- ===== Hero (단일 페이지 인트로) =====
         Figma 830:313(hero1) = 인트로 시작 상태(중앙 점)
         Figma 830:315(hero2) = 인트로 종료 상태(최종 메인 화면)
         두 상태는 같은 DOM 안에서 GSAP 타임라인으로 연결됨 (js/main.js) -->
    <section id="home" class="hero2">
      <div class="hero2__top">
        <p class="hero2__logo">DESIGNER</p>
        <nav class="hero2__nav" aria-label="주요 메뉴">
          <a href="#home">Home</a>
          <a href="#about">About</a>
          <a href="#process">Process</a>
          <a href="#project">Project</a>
          <a href="#contact">Contact</a>
        </nav>
      </div>

      <!-- 인라인 SVG: 시작 상태(작은 점)가 마크업에 박혀 있어 JS 로드 전에도 즉시 보임.
           .mark__morph  = 모핑용 레이어 (점 → g/구멍/y/악센트)
           .mark__final  = 원본 로고 path (모핑 종료 시 크로스페이드되어 최종 상태 보장) -->
      <div class="hero2__mark">
        <svg class="mark" viewBox="0 0 1254 1254" role="img" aria-label="gy — 김가영 로고">
          <g class="mark__morph">
            <path class="mark__g" d="M 644 618 a 27 27 0 1 0 54 0 a 27 27 0 1 0 -54 0 Z" />
            <path class="mark__hole" d="M 393.5 454.5 a 1 1 0 1 0 2 0 a 1 1 0 1 0 -2 0 Z" />
            <path class="mark__y" d="M 807 741.5 a 1 1 0 1 0 2 0 a 1 1 0 1 0 -2 0 Z" opacity="0" />
            <path class="mark__acc" d="M 1015 285 a 1 1 0 1 0 2 0 a 1 1 0 1 0 -2 0 Z" opacity="0" />
          </g>

        </svg>
        <!-- 입자 인터랙션 캔버스 (인트로 종료 후 is-live 클래스로 표시) -->
        <canvas class="mark__canvas" aria-hidden="true"></canvas>
      </div>

      <div class="hero2__bottom">
        <p class="hero2__credit">
          <span>KIM GAYOUNG</span>
          <span>UX/UI DESIGNER · AI WORKFLOW BUILDER</span>
        </p>
        <p class="hero2__scroll">SCROLL DOWN</p>
      </div>
    </section>

    <!-- ===== 3. Video Gallery (Figma 830:350 "hero5") =====
         정적 최종 레이아웃. placeholder 이미지 사용 중 — 실제 영상(video 태그)으로 교체 예정.
         스크롤 전환·로고 마스크 인터랙션은 다음 단계에서 추가.
         DOM 순서 = 겹침 순서(아래→위): main → right → left → tall(최상위) -->
    <section id="gallery" class="vgallery">
      <div class="vgallery__stage">

        <figure class="vgallery__item vgallery__item--main">
          <!-- 재생 실패 시 poster가 그대로 보임. data-mobile-play: 터치 기기에서도 재생하는 핵심 영상 -->
          <video autoplay muted loop playsinline preload="metadata"
                 poster="img/gallery-01.png" data-mobile-play aria-label="작업 과정 영상">
            <source src="videos/video-01.mp4" type="video/mp4" />
          </video>
          <div class="vgallery__fade" aria-hidden="true"></div>
        </figure>

        <figure class="vgallery__item vgallery__item--right">
          <video autoplay muted loop playsinline preload="metadata"
                 poster="img/gallery-04.png" aria-label="일광전구 발표 영상">
            <source src="videos/video-04.mp4" type="video/mp4" />
          </video>
        </figure>

        <figure class="vgallery__item vgallery__item--left">
          <img src="img/gallery-03.png" alt="VIDEO 03 — 질감 영상 자리" loading="lazy" />
          <figcaption class="vgallery__label">VIDEO 03</figcaption>
        </figure>

        <figure class="vgallery__item vgallery__item--tall">
          <img src="img/gallery-02.png" alt="VIDEO 02 — 작업 과정 영상 자리" loading="lazy" />
          <figcaption class="vgallery__label">VIDEO 02</figcaption>
        </figure>

      </div>
    </section>

      </div><!-- /.hvt__sticky -->
    </div><!-- /.hvt -->

    <!-- 다음 섹션은 Figma 프레임 확인 후 순서대로 추가 -->

  </main>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/flubber@0.4.2/build/flubber.min.js"></script>

       되살리려면 아래 주석 해제 (main.js의 onComplete 가드는 그대로 있음)
  <script src="js/logo-particles.js"></script> -->
  <script src="js/gallery-video.js"></script>
  <script src="js/vlogo.js"></script>
  <script src="js/main.js"></script>
