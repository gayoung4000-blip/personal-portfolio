name: Vercel Auto Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: vercel-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Trigger production deployment
    runs-on: ubuntu-latest
    steps:
      - name: Call Vercel deploy hook
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          test -n "$VERCEL_DEPLOY_HOOK_URL"
          curl --fail --silent --show-error --request POST "$VERCEL_DEPLOY_HOOK_URL"
